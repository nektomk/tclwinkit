name: ci

# Two jobs, both verified on a real fresh clone of this repository before this
# file was committed (see docs/CONVENTIONS.md section 7 and CONTRIBUTING.md
# "Reproducibility"). Nothing here pretends to build a kit: unpacking vendor/
# into the fixed build/<chain>/ layout and applying patches/ are still manual
# steps documented in docs/SOURCES.md and patches/README.md, so a build job
# would have nothing to run. That gap is recorded in docs/PLAN.md, not hidden.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The three-level encoding rule and the two determinism gates that belong
  # with it. On a checkout with no build/, no dist/ and no vendor/ the three
  # artifact sections SKIP LOUDLY rather than passing silently; -RequireArtifacts
  # exists for the local pre-publish run where the assets do exist.
  encoding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain actually under test
        run: |
          git --version
          $PSVersionTable.PSVersion.ToString()
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription

      # Runs BEFORE the gate it tests, and costs ~23 s on a checkout like this
      # one (36 s where the artifacts exist). Reason: this job is the one place
      # where the gate's three artifact sections have nothing to look at, so it
      # is also the one place where a section that skips silently would go
      # unnoticed. The script builds throwaway repos and archives with exactly
      # one injected defect each and requires the gate to fail AND name that
      # defect; a gate only ever observed passing is not evidence.
      - name: Negative control for the gates
        run: ./scripts/check-gates-selftest.ps1

      # Exit code of the script is the number of failed assertions, so the step
      # fails on its own and no log parsing is needed here.
      - name: Encoding and determinism gate
        run: ./scripts/check-encoding.ps1

      # Deliberately NOT windows-latest as well. A second OS would be the real
      # test of the .gitattributes normalization, but this repository's rule is
      # that a gate ships only after it has been seen run; there is no Linux,
      # no PowerShell 7 and no container on the reference machine, so that leg
      # has never executed anywhere and would be an unexercised promise in
      # public. It is tracked as a post-flip item instead.

  # Step zero of CONTRIBUTING.md, executed: every archive in the map downloads
  # from its recorded URL and passes size, SHA-256 and archive-shape checks.
  # This is the only job that catches a moved branch head or a dead mirror,
  # which is precisely what the four movable refs in docs/SOURCES.md are prone
  # to. curl.exe is resolved from %SystemRoot%\System32 by the script, so this
  # job is Windows-only by construction, not by preference.
  sources:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify all 15 vendor archives
        run: ./scripts/fetch-vendor.ps1

      - name: Verify again without network access (idempotence)
        run: ./scripts/fetch-vendor.ps1 -VerifyOnly

      - name: Report what landed
        run: |
          $f = Get-ChildItem vendor -File
          $f | Sort-Object Name | ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.Name }
          $sum = ($f | Measure-Object -Property Length -Sum).Sum
          'total: {0:N2} MB over {1} files' -f ($sum / 1MB), @($f).Count
